name: "Publish image to GHCR on push to branch"

on:
  push:
    branches-ignore:
      - "main"

concurrency:
  group: infra-otc-cert-manager-webhook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push:
    permissions:
      packages: write
      security-events: write
      contents: read
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@ac540af7a37263a102c7bc6c8c9447a7b176f027 # 8.6.0
    with:
      image_name: "infra-otc-cert-manager-webhook"
      run_trivy_scan: true
      run_clamav_scan: true
      image_tag_generation: "ticket_from_branch"
      add_latest_tag: false
      container_registry: "ghcr.io"
      limit-severities-for-sarif: true
